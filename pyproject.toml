[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brainscan-ai"
version = "0.1.0"
description = "Brain MRI classification and detection research prototype"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "Pillow>=11,<13",
    "numpy>=1.26,<3",
    "tensorflow-cpu>=2.20,<2.23",
    "keras>=3.12,<4",
    "ultralytics>=8.3,<9",
]
ui = ["streamlit>=1.45,<2", "requests>=2.32,<3", "Pillow>=11,<13"]
tracking = ["mlflow>=3.5,<4"]

[tool.setuptools.packages.find]
include = ["api*", "src*"]
namespaces = true
