services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      CLASSIFIER_PATH: ${CLASSIFIER_PATH:-/app/models/classification/inceptionv3_multiscale_v2.keras}
      DETECTOR_PATH: ${DETECTOR_PATH:-/app/models/final/yolo/best.pt}
      OMP_NUM_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow_data
      - ./models:/app/models:ro
    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow_data/mlflow.db
      --artifacts-destination /mlflow_data/artifacts --serve-artifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mlflow_data:
